<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F7F5F0"/>

  <!-- Subtle grid texture -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#4A6FA5" stroke-width="1" stroke-opacity="0.08"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#4A6FA5" stroke-width="1" stroke-opacity="0.05"/>

  <!-- Large background logo mark — right side -->
  <g transform="translate(780, 115) scale(5)" opacity="0.07">
    <path d="M32 6 C32 6, 48 16, 48 29 C48 37.8 40.8 44 32 44 C23.2 44 16 37.8 16 29 C16 16 32 6 32 6Z" fill="#4A6FA5"/>
    <path d="M32 58 C32 58, 48 48, 48 35 C48 26.2 40.8 20 32 20 C23.2 20 16 26.2 16 35 C16 48 32 58 32 58Z" fill="#A8C3A0"/>
  </g>

  <!-- Logo mark — left column -->
  <g transform="translate(80, 72)">
    <line x1="4" y1="32" x2="60" y2="32" stroke="#4A6FA5" stroke-width="1" stroke-opacity="0.25"/>
    <path d="M32 6 C32 6, 48 16, 48 29 C48 37.8 40.8 44 32 44 C23.2 44 16 37.8 16 29 C16 16 32 6 32 6Z" fill="#4A6FA5"/>
    <path d="M32 58 C32 58, 48 48, 48 35 C48 26.2 40.8 20 32 20 C23.2 20 16 26.2 16 35 C16 48 32 58 32 58Z" fill="#A8C3A0" opacity="0.75"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="116" font-family="Georgia, serif" font-size="22" font-weight="400" fill="#1F2A37" letter-spacing="1" opacity="0.6">adhd reflect</text>

  <!-- Mono label -->
  <text x="80" y="210" font-family="'Courier New', monospace" font-size="13" fill="#4A6FA5" letter-spacing="3" text-transform="uppercase">FOR ADHD PARENTS RAISING ADHD KIDS</text>

  <!-- Main headline -->
  <text x="80" y="310" font-family="Georgia, serif" font-size="74" font-weight="300" fill="#1F2A37">What just</text>
  <text x="80" y="400" font-family="Georgia, serif" font-size="74" font-weight="300" font-style="italic" fill="#4A6FA5">happened?</text>

  <!-- Body text -->
  <text x="80" y="470" font-family="-apple-system, sans-serif" font-size="22" fill="#56606E" opacity="0.85">Describe a hard moment. Find what's actually going on.</text>
  <text x="80" y="500" font-family="-apple-system, sans-serif" font-size="22" fill="#56606E" opacity="0.85">Not generic parenting advice. The specific ADHD dynamic underneath.</text>

  <!-- URL pill -->
  <rect x="80" y="545" width="220" height="40" rx="20" fill="#4A6FA5" opacity="0.12"/>
  <text x="190" y="570" font-family="'Courier New', monospace" font-size="15" fill="#4A6FA5" text-anchor="middle" letter-spacing="0.5">adhdreflect.com</text>

  <!-- Right side accent cards -->
  <rect x="820" y="200" width="300" height="72" rx="12" fill="white" opacity="0.7"/>
  <rect x="820" y="200" width="4" height="72" rx="2" fill="#4A6FA5"/>
  <text x="840" y="228" font-family="-apple-system, sans-serif" font-size="13" fill="#56606E" opacity="0.7">5.47pm. Your kid is losing it.</text>
  <text x="840" y="248" font-family="-apple-system, sans-serif" font-size="13" fill="#56606E" opacity="0.7">You know exactly what you're</text>
  <text x="840" y="264" font-family="-apple-system, sans-serif" font-size="13" fill="#56606E" opacity="0.7">supposed to do.</text>

  <rect x="850" y="292" width="280" height="60" rx="12" fill="white" opacity="0.6"/>
  <rect x="850" y="292" width="4" height="60" rx="2" fill="#A8C3A0"/>
  <text x="870" y="316" font-family="-apple-system, sans-serif" font-size="13" fill="#56606E" opacity="0.7">You do the opposite anyway.</text>
  <text x="870" y="336" font-family="-apple-system, sans-serif" font-size="13" fill="#56606E" opacity="0.7">Every time.</text>

  <rect x="870" y="372" width="260" height="60" rx="12" fill="white" opacity="0.5"/>
  <rect x="870" y="372" width="4" height="60" rx="2" fill="#C4A8C8" opacity="0.7"/>
  <text x="890" y="396" font-family="-apple-system, sans-serif" font-size="13" fill="#56606E" opacity="0.7">That gap — between knowing</text>
  <text x="890" y="416" font-family="-apple-system, sans-serif" font-size="13" fill="#56606E" opacity="0.7">and doing — has an explanation.</text>
</svg>
